[build]
  command = "sh scripts/update-rosu.sh && python3 scripts/patch-pp-v4.py"
  publish = "."

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/rosu_pp_js/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
